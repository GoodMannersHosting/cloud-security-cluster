name: Sync OpenBao policies

on:
  push:
    branches: [main]
    paths:
      - "bao/policies/**"
      - "bao/roles/**"
      - "bao/jwt/**"
      - "bao/sync-from-git.sh"
      - "bao/validate-sync.sh"
      - ".github/workflows/bao-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bao-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  BAO_ADDR: https://keeper.goodmanners.services
  GITHUB_JWT_MOUNT: jwt
  GITHUB_JWT_AUDIENCE: https://github.com/GoodMannersHosting
  GITHUB_REPOSITORY: GoodMannersHosting/aws-security-cluster
  GITHUB_REF: refs/heads/main
  JWT_ROLE: github-actions-ci
  BAO_CLI_VERSION: "2.6.1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate manifests (pre-auth)
        run: bash bao/validate-sync.sh

      - name: Install OpenBao CLI
        run: |
          set -euo pipefail
          curl -fsSL -o openbao.deb \
            "https://github.com/openbao/openbao/releases/download/v${BAO_CLI_VERSION}/openbao_${BAO_CLI_VERSION}_linux_amd64.deb"
          sudo dpkg -i openbao.deb
          bao version
          bash bao/validate-sync.sh

      - name: Authenticate to OpenBao (GitHub OIDC)
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.BAO_ADDR }}
          method: jwt
          path: ${{ env.GITHUB_JWT_MOUNT }}
          role: ${{ env.JWT_ROLE }}
          jwtGithubAudience: ${{ env.GITHUB_JWT_AUDIENCE }}
          exportToken: true
          exportEnv: false

      - name: Apply policies and roles
        env:
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          BAO_TOKEN: ${{ env.VAULT_TOKEN }}
        run: bash bao/sync-from-git.sh

      - name: Post-sync smoke test
        env:
          BAO_TOKEN: ${{ env.VAULT_TOKEN }}
        run: |
          set -euo pipefail
          bao policy read ci-sync >/dev/null
          bao read "auth/${GITHUB_JWT_MOUNT}/role/${JWT_ROLE}" >/dev/null
          echo "smoke ok"
