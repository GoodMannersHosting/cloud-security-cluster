name: Sync OpenBao policies

on:
  push:
    branches: [main]
    paths:
      - "bao/policies/**"
      - "bao/roles/**"
      - "bao/namespaces/**"
      - "bao/jwt/**"
      - "bao/kubernetes/**"
      - "bao/sync-from-git.sh"
      - "bao/validate-sync.sh"
      - ".github/workflows/bao-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bao-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  BAO_ADDR: https://keeper.goodmanners.services
  GITHUB_JWT_MOUNT: jwt
  GITHUB_JWT_AUDIENCE: https://github.com/GoodMannersHosting
  JWT_ROLE: github-actions-ci

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache OpenBao CLI
        id: cache-bao
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/bao
          key: openbao-2.6.2-linux-amd64

      - name: Install OpenBao CLI
        if: steps.cache-bao.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -sSL -o /tmp/openbao.tar.gz \
            https://github.com/openbao/openbao/releases/download/v2.6.2/openbao_2.6.2_linux_amd64.tar.gz
          tar -xzf /tmp/openbao.tar.gz -C /tmp/ bao
          mv /tmp/bao ~/.local/bin/bao
          chmod +x ~/.local/bin/bao
          rm /tmp/openbao.tar.gz

      - name: Add bao to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate manifests (pre-auth)
        run: bash bao/validate-sync.sh

      - name: Authenticate to OpenBao (GitHub OIDC)
        id: auth
        run: |
          set -euo pipefail

          OIDC_TOKEN=$(curl -sf \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${GITHUB_JWT_AUDIENCE}" \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | jq -r '.value')

          if [[ -z "$OIDC_TOKEN" || "$OIDC_TOKEN" == "null" ]]; then
            echo "ERROR: failed to obtain OIDC token" >&2
            exit 1
          fi

          BAO_TOKEN=$(curl -sf -X POST "${BAO_ADDR}/v1/auth/${GITHUB_JWT_MOUNT}/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg role "${JWT_ROLE}" --arg jwt "${OIDC_TOKEN}" '{role:$role,jwt:$jwt}')" \
            | jq -r '.auth.client_token')

          if [[ -z "$BAO_TOKEN" || "$BAO_TOKEN" == "null" ]]; then
            echo "ERROR: failed to obtain OpenBao token" >&2
            exit 1
          fi

          # Mask the token so it never appears in logs
          echo "::add-mask::${BAO_TOKEN}"
          echo "BAO_TOKEN=${BAO_TOKEN}" >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=${BAO_TOKEN}" >> "$GITHUB_ENV"
          echo "Authenticated to OpenBao"

      - name: Apply policies and roles
        env:
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
        run: bash bao/sync-from-git.sh

      - name: Post-sync smoke test
        run: |
          set -euo pipefail
          bao read sys/policies/acl/ci-sync >/dev/null
          bao read "auth/${GITHUB_JWT_MOUNT}/role/${JWT_ROLE}" >/dev/null
          echo "smoke ok"
