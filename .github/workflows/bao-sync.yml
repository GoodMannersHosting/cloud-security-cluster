name: Sync OpenBao policies

on:
  push:
    branches: [main]
    paths:
      - "bao/policies/**"
      - "bao/roles/**"
      - "bao/namespaces/**"
      - "bao/jwt/**"
      - "bao/kubernetes/**"
      - "bao/sync-from-git.sh"
      - "bao/validate-sync.sh"
      - ".github/workflows/bao-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bao-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  BAO_ADDR: https://keeper.goodmanners.services
  GITHUB_JWT_MOUNT: jwt
  GITHUB_JWT_AUDIENCE: https://github.com/GoodMannersHosting
  GITHUB_REPOSITORY: "${{ github.repository }}"
  GITHUB_REF: "${{ github.ref }}"
  JWT_ROLE: github-actions-ci
  BAO_CLI_VERSION: "2.6.2"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate manifests (pre-auth)
        run: bash bao/validate-sync.sh

      - name: Install OpenBao CLI
        run: |
          set -euo pipefail
          curl -fsSL -o openbao.deb \
            "https://github.com/openbao/openbao/releases/download/v${BAO_CLI_VERSION}/openbao_${BAO_CLI_VERSION}_linux_amd64.deb"
          sudo dpkg -i openbao.deb
          bao version
          bash bao/validate-sync.sh

      - name: Authenticate to OpenBao (GitHub OIDC)
        env:
          BAO_ADDR: ${{ env.BAO_ADDR }}
        run: |
          set -euo pipefail
          # Request OIDC token from GitHub with the configured audience
          REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL//&/\\&}"
          OIDC_TOKEN=$(curl -s "$REQUEST_URL&audience=${GITHUB_JWT_AUDIENCE}" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          
          echo "Got OIDC token from GitHub"
          
          # Exchange OIDC token for OpenBao token via API
          RESPONSE=$(curl -s -X POST ${BAO_ADDR}/v1/auth/jwt/login \
            -H "Content-Type: application/json" \
            -d "{\"role\": \"${JWT_ROLE}\", \"jwt\": \"${OIDC_TOKEN}\"}")
          echo "Response: $RESPONSE" >> $GITHUB_STEP_SUMMARY
          BAO_TOKEN=$(echo "$RESPONSE" | jq -r '.auth.client_token')
          echo "BAO_TOKEN=$BAO_TOKEN" >> $GITHUB_ENV
          echo "Authenticated to OpenBao"



      - name: Apply policies and roles
        env:
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          BAO_TOKEN: ${{ env.BAO_TOKEN }}
        run: bash bao/sync-from-git.sh

      - name: Post-sync smoke test
        env:
          BAO_TOKEN: ${{ env.VAULT_TOKEN }}
        run: |
          set -euo pipefail
          bao policy read ci-sync >/dev/null
          bao read "auth/${GITHUB_JWT_MOUNT}/role/${JWT_ROLE}" >/dev/null
          echo "smoke ok"
