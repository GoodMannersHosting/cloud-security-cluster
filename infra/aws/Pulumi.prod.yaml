  keeper-aws-infra:githubOrg: GoodMannersHosting@88983444
  keeper-aws-infra:githubRepo: cloud-security-cluster@1166064097
  keeper-aws-infra:hostedZoneName: goodmanners.services
  # Uncomment if the account already has a GitHub OIDC provider:
  # keeper-aws-infra:githubOidcProviderArn: arn:aws:iam::ACCOUNT:oidc-provider/token.actions.githubusercontent.com
  # Optional: create Roles Anywhere role trusted by this trust anchor:
  # keeper-aws-infra:rolesAnywhereTrustAnchorArn: arn:aws:rolesanywhere:us-east-1:ACCOUNT:trust-anchor/TA_ID

  keeper-aws-infra:githubOidcProviderArn: arn:aws:iam::417568418531:oidc-provider/token.actions.githubusercontent.com

  # Authentik + IAM Identity Center (see docs/superpowers/specs/2026-08-02-authentik-identity-center-design.md)
