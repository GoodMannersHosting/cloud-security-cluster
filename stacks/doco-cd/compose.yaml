# Project name must match .doco-cd.yml (hcloud-doco-cd) so GitOps self-deploy
# does not fight a separate manual compose project.
name: hcloud-doco-cd

services:
  app:
    image: ghcr.io/kimdre/doco-cd:0.119.0@sha256:c0eedd8e81bc7d8dc83753cf0b1c7bdedf588400d826154ccb641b25f12c7770
    container_name: doco-cd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - secrets.enc.env
    environment:
      HTTP_PORT: "80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks:ro
      - doco_cd_data:/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      # Static deploy labels so Doco-CD can skip redeploy when this stack is unchanged.
      - cd.doco.source.type=git
      - cd.doco.source.name=GoodMannersHosting/aws-security-cluster
      - cd.doco.source.url=https://github.com/GoodMannersHosting/aws-security-cluster.git
      - cd.doco.deployment.name=hcloud-doco-cd
      # GitOps self-deploy: avoid recreating this container on bind/secret drift
      - "cd.doco.deployment.recreate.ignore={bindMounts: [/var/run/docker.sock, /opt/stacks, /data], secrets: [sops_age_key]}"
      - traefik.docker.network=traefik
      - traefik.http.services.doco-cd.loadbalancer.server.port=80
      # GitHub/GitLab webhooks cannot pass Authentik forward auth.
      - traefik.http.routers.doco-cd-webhook.rule=Host(`${DOCO_CD_HOSTNAME}`) && PathPrefix(`/v1/webhook`)
      - traefik.http.routers.doco-cd-webhook.entrypoints=websecure
      - traefik.http.routers.doco-cd-webhook.tls=true
      - traefik.http.routers.doco-cd-webhook.tls.certresolver=letsencrypt
      - traefik.http.routers.doco-cd-webhook.priority=100
      - "traefik.http.routers.doco-cd-webhook.middlewares=ratelimit-webhook@file,security-headers@file"
      - traefik.http.routers.doco-cd-webhook.service=doco-cd
      # Health checks and probes cannot pass Authentik forward auth.
      - traefik.http.routers.doco-cd-health.rule=Host(`${DOCO_CD_HOSTNAME}`) && PathPrefix(`/v1/health`)
      - traefik.http.routers.doco-cd-health.entrypoints=websecure
      - traefik.http.routers.doco-cd-health.tls=true
      - traefik.http.routers.doco-cd-health.tls.certresolver=letsencrypt
      - traefik.http.routers.doco-cd-health.priority=100
      - "traefik.http.routers.doco-cd-health.middlewares=security-headers@file"
      - traefik.http.routers.doco-cd-health.service=doco-cd
      - traefik.http.routers.doco-cd.rule=Host(`${DOCO_CD_HOSTNAME}`)
      - traefik.http.routers.doco-cd.entrypoints=websecure
      - traefik.http.routers.doco-cd.tls=true
      - traefik.http.routers.doco-cd.tls.certresolver=letsencrypt
      - traefik.http.routers.doco-cd.priority=1
      - "traefik.http.routers.doco-cd.middlewares=forward-auth-authentik@file,security-headers@file"
      - traefik.http.routers.doco-cd.service=doco-cd
    security_opt:
      - no-new-privileges:true

networks:
  traefik:
    external: true

volumes:
  doco_cd_data:
    name: doco-cd_doco_cd_data
    external: true
