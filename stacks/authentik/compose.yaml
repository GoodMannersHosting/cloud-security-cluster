name: authentik

services:
  postgresql:
    image: docker.io/library/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: authentik-postgresql
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
    env_file:
      - secrets.enc.env
    volumes:
      - ${AUTHENTIK_DATA_ROOT:-/mnt/sec-hil-1-authentik}/postgres:/var/lib/postgresql
    networks:
      - authentik
    security_opt:
      - no-new-privileges:true

  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: authentik-socket-proxy
    restart: unless-stopped
    read_only: false
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LOG_LEVEL: info
      CONTAINERS: 1
      EVENTS: 1
      IMAGES: 1
      NETWORKS: 1
      PING: 1
      VERSION: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      POST: 1
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - authentik

  server:
    image: ghcr.io/goauthentik/server:2026.8.0
    container_name: authentik-server
    restart: unless-stopped
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
    shm_size: 512mb
    env_file:
      - secrets.enc.env
    volumes:
      - ${AUTHENTIK_DATA_ROOT:-/mnt/sec-hil-1-authentik}/data:/data
      - ${AUTHENTIK_DATA_ROOT:-/mnt/sec-hil-1-authentik}/custom-templates:/templates
    networks:
      - authentik
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_HOSTNAME}`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.tls=true
      - traefik.http.routers.authentik.tls.certresolver=letsencrypt
      - traefik.http.routers.authentik.middlewares=security-headers@file
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      - traefik.http.routers.authentik-outpost-doco.rule=Host(`${DOCO_CD_HOSTNAME}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.authentik-outpost-doco.entrypoints=websecure
      - traefik.http.routers.authentik-outpost-doco.tls=true
      - traefik.http.routers.authentik-outpost-doco.tls.certresolver=letsencrypt
      - traefik.http.routers.authentik-outpost-doco.priority=100
      - traefik.http.routers.authentik-outpost-doco.service=authentik
      - traefik.http.routers.authentik-outpost-traefik.rule=Host(`${TRAEFIK_DASHBOARD_HOSTNAME}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.authentik-outpost-traefik.entrypoints=websecure
      - traefik.http.routers.authentik-outpost-traefik.tls=true
      - traefik.http.routers.authentik-outpost-traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.authentik-outpost-traefik.priority=100
      - traefik.http.routers.authentik-outpost-traefik.service=authentik
    security_opt:
      - no-new-privileges:true

  worker:
    image: ghcr.io/goauthentik/server:2026.8.0
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      DOCKER_HOST: tcp://socket-proxy:2375
    shm_size: 512mb
    user: root
    env_file:
      - secrets.enc.env
    volumes:
      - ${AUTHENTIK_DATA_ROOT:-/mnt/sec-hil-1-authentik}/data:/data
      - ${AUTHENTIK_DATA_ROOT:-/mnt/sec-hil-1-authentik}/media:/media
      - ${AUTHENTIK_DATA_ROOT:-/mnt/sec-hil-1-authentik}/certs:/certs
      - ${AUTHENTIK_DATA_ROOT:-/mnt/sec-hil-1-authentik}/custom-templates:/templates
      - ${AUTHENTIK_BLUEPRINTS_PATH:-../../authentik/blueprints}:/blueprints/custom:ro
    networks:
      - authentik
    security_opt:
      - no-new-privileges:true

networks:
  authentik:
    name: authentik
    driver: bridge
  traefik:
    name: traefik
    external: true
