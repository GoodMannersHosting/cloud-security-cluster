name: powerdns

services:
  postgresql:
    image: docker.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    container_name: powerdns-postgresql
    restart: unless-stopped
    env_file:
      - secrets.enc.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?set POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB:-pdns}
      POWERADMIN_DB: ${POWERADMIN_DB:-poweradmin}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ${POWERDNS_POSTGRES_DATA:-/mnt/data/postgres/powerdns}:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-poweradmin-db.sh:/docker-entrypoint-initdb.d/02-poweradmin-db.sh:ro
    networks:
      - powerdns
    security_opt:
      - no-new-privileges:true

  authoritative:
    image: docker.io/powerdns/pdns-auth-51:5.1.4@sha256:bb5b1c133bcca1dd455075321de7d55db4945a8d7f2ba23339e3c7bbe416b205
    container_name: powerdns-authoritative
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - secrets.enc.env
    # Image ENTRYPOINT is pdns_server-startup; override so we control startup.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec pdns_server \
          --config-dir=/etc/powerdns \
          --api-key="$${PDNS_AUTH_API_KEY}" \
          --webserver-password="$${PDNS_AUTH_WEB_KEY}" \
          --gpgsql-dbname="$${POSTGRES_DB}" \
          --gpgsql-user="$${POSTGRES_USER}" \
          --gpgsql-password="$${POSTGRES_PASS}"
    healthcheck:
      test:
        - CMD-SHELL
        - pdns_control rping
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:uid=953,gid=953,mode=1777
      - /var/run/pdns:uid=953,gid=953,mode=0755
    volumes:
      - ./pdns.conf:/etc/powerdns/pdns.conf:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - powerdns
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.powerdns.rule=Host(`${POWERDNS_API_HOSTNAME}`)
      - traefik.http.routers.powerdns.entrypoints=websecure
      - traefik.http.routers.powerdns.tls=true
      - traefik.http.routers.powerdns.tls.certresolver=letsencrypt
      - traefik.http.routers.powerdns.middlewares=ratelimit-powerdns@file,security-headers@file
      - traefik.http.services.powerdns.loadbalancer.server.port=8081
      - traefik.tcp.routers.powerdns-dns-tcp.entrypoints=dns-tcp
      - traefik.tcp.routers.powerdns-dns-tcp.rule=HostSNI(`*`)
      - traefik.tcp.routers.powerdns-dns-tcp.service=powerdns-dns-tcp
      - traefik.tcp.services.powerdns-dns-tcp.loadbalancer.server.port=53
      - traefik.udp.routers.powerdns-dns-udp.entrypoints=dns-udp
      - traefik.udp.routers.powerdns-dns-udp.service=powerdns-dns-udp
      - traefik.udp.services.powerdns-dns-udp.loadbalancer.server.port=53

  poweradmin:
    image: docker.io/poweradmin/poweradmin:4.4.1@sha256:612ca40271cd3d5f00e0174dbfa5cd2b1b39e9f94fd591dbf37a7b89efd82c24
    container_name: poweradmin
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      authoritative:
        condition: service_healthy
    env_file:
      - secrets.enc.env
    environment:
      # App DB on the stack Postgres; DNS data stays in POSTGRES_DB via API mode.
      DB_TYPE: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASS:?set POSTGRES_PASS}
      DB_NAME: ${POWERADMIN_DB:-poweradmin}
      PA_DNS_BACKEND: api
      PA_PDNS_API_URL: http://authoritative:8081
      PA_PDNS_API_KEY: ${PDNS_AUTH_API_KEY:?set PDNS_AUTH_API_KEY}
      PA_PDNS_SERVER_NAME: localhost
      DNS_NS1: ${POWERADMIN_DNS_NS1:-ns1.example.com}
      DNS_NS2: ${POWERADMIN_DNS_NS2:-ns2.example.com}
      DNS_HOSTMASTER: ${POWERADMIN_DNS_HOSTMASTER:-hostmaster.example.com}
      PA_CREATE_ADMIN: ${POWERADMIN_CREATE_ADMIN:-0}
      PA_ADMIN_USERNAME: ${POWERADMIN_ADMIN_USERNAME:-admin}
      PA_ADMIN_PASSWORD: ${POWERADMIN_ADMIN_PASSWORD:-}
      PA_ADMIN_EMAIL: ${POWERADMIN_ADMIN_EMAIL:-admin@example.com}
      PA_ADMIN_FULLNAME: ${POWERADMIN_ADMIN_FULLNAME:-Administrator}
      # Authentik OIDC (generic provider); client secret from Authentik UI after blueprint.
      PA_OIDC_ENABLED: ${PA_OIDC_ENABLED:-true}
      PA_OIDC_AUTO_PROVISION: ${PA_OIDC_AUTO_PROVISION:-true}
      PA_OIDC_LINK_BY_EMAIL: ${PA_OIDC_LINK_BY_EMAIL:-true}
      PA_OIDC_SYNC_USER_INFO: ${PA_OIDC_SYNC_USER_INFO:-true}
      PA_OIDC_DEFAULT_PERMISSION_TEMPLATE: ${PA_OIDC_DEFAULT_PERMISSION_TEMPLATE:-Guest}
      PA_OIDC_PERMISSION_TEMPLATE_MAPPING: ${PA_OIDC_PERMISSION_TEMPLATE_MAPPING:-poweradmin-admin=Administrator,poweradmin-viewer=Viewer}
      PA_OIDC_GENERIC_ENABLED: ${PA_OIDC_GENERIC_ENABLED:-true}
      PA_OIDC_GENERIC_NAME: Authentik
      PA_OIDC_GENERIC_DISPLAY_NAME: Sign in with Authentik
      PA_OIDC_GENERIC_CLIENT_ID: ${PA_OIDC_GENERIC_CLIENT_ID:-poweradmin}
      PA_OIDC_GENERIC_CLIENT_SECRET: ${PA_OIDC_GENERIC_CLIENT_SECRET:?set PA_OIDC_GENERIC_CLIENT_SECRET}
      PA_OIDC_GENERIC_AUTO_DISCOVERY: "true"
      PA_OIDC_GENERIC_METADATA_URL: ${PA_OIDC_GENERIC_METADATA_URL:-https://auth.goodmanners.services/application/o/poweradmin/.well-known/openid-configuration}
      PA_OIDC_GENERIC_SCOPES: ${PA_OIDC_GENERIC_SCOPES:-openid profile email groups}
      PA_OIDC_GENERIC_GROUPS_ATTR: ${PA_OIDC_GENERIC_GROUPS_ATTR:-groups}
      # Writable path for settings.php when root FS is read-only (default is /app/config).
      PA_CONFIG_PATH: /config/settings.php
    volumes:
      - ${POWERADMIN_DATA_ROOT:-/mnt/data/poweradmin}/config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      # FrankenPHP/Caddy XDG paths; required with read_only root.
      - /var/caddy:rw,noexec,nosuid
      - /db:rw,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Bind :80 after drop to www-data; entrypoint chown/su-exec under read_only.
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf "http://localhost:$$(cat /tmp/.server_port 2>/dev/null || echo 80)/" -o /dev/null
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - powerdns
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.poweradmin.rule=Host(`${POWERADMIN_HOSTNAME:-poweradmin.goodmanners.services}`)
      - traefik.http.routers.poweradmin.entrypoints=websecure
      - traefik.http.routers.poweradmin.tls=true
      - traefik.http.routers.poweradmin.tls.certresolver=letsencrypt
      - traefik.http.routers.poweradmin.middlewares=security-headers@file
      - traefik.http.services.poweradmin.loadbalancer.server.port=8080

networks:
  powerdns:
    driver: bridge
  traefik:
    external: true
